{% extends 'mailing/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card text-white bg-primary mb-3">
            <div class="card-body">
                <h5 class="card-title">Всего рассылок</h5>
                <h2 class="card-text">{{ total_mailings }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-success mb-3">
            <div class="card-body">
                <h5 class="card-title">Активные рассылки</h5>
                <h2 class="card-text">{{ active_mailings }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-info mb-3">
            <div class="card-body">
                <h5 class="card-title">Уникальные клиенты</h5>
                <h2 class="card-text">{{ unique_clients }}</h2>
            </div>
        </div>
    </div>
</div>
{% endblock %}
